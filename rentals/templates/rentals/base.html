!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VICE RENTALS - San Andreas &amp; Vice City</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@400;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'surface-container-lowest': '#110b1f',
            'surface-container-low': '#1e182d',
            'surface-container': '#221c31',
            'surface-container-high': '#2d273c',
            'surface-container-highest': '#383147',
            'surface-dim': '#161024',
            'surface': '#161024',
            'background': '#161024',
            'primary': '#ffb1c4',
            'secondary': '#d3fbff',
            'secondary-container': '#00eefc',
            'secondary-fixed': '#7df4ff',
            'tertiary': '#fbabff',
            'on-surface': '#e9defb',
            'on-surface-variant': '#e5bcc5',
            'error-container': '#93000a',
            'error': '#ffb4ab',
            'on-error': '#690005'
          },
          fontFamily: {
            'display': ['Anton', 'sans-serif'],
            'body': ['Geist', 'sans-serif'],
            'mono': ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
  </script>
  
  <style>
    @layer base {
      html, body {
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #161024;
      }
      body {
        overscroll-behavior: none;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#161024] font-body text-[#e9defb] min-h-screen antialiased">
  <main class="max-w-md mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
