{% load static %}
<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VICE RENTALS - San Andreas &amp; Vice City</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@400;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'surface-container-lowest': '#110b1f',
            'surface-container-low': '#1e182d',
            'surface-container': '#221c31',
            'surface-container-high': '#2d273c',
            'surface-container-highest': '#383147',
            'surface-dim': '#161024',
            'surface': '#161024',
            'background': '#161024',
            'primary': '#ffb1c4',
            'secondary': '#d3fbff',
            'secondary-container': '#00eefc',
            'secondary-fixed': '#7df4ff',
            'tertiary': '#fbabff',
            'on-surface': '#e9defb',
            'on-surface-variant': '#e5bcc5',
            'error-container': '#93000a',
            'error': '#ffb4ab',
            'on-error': '#690005'
          },
          fontFamily: {
            'display': ['Anton', 'sans-serif'],
            'body': ['Geist', 'sans-serif'],
            'mono': ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
  </script>
  
  <style>
    @layer base {
      html, body {
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #161024;
      }
      body {
        overscroll-behavior: none;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#161024] font-body text-[#e9defb] min-h-screen antialiased">
  <main class="max-w-md mx-auto px-4 py-8">

    <a href="{% url 'home' %}" class="font-mono text-xs text-[#00eefc] uppercase tracking-widest">← Back</a>

    <h1 class="font-display text-3xl uppercase text-white mt-4">Pick your dates</h1>

    <div id="calendar" class="mt-6"></div>

    <div class="flex justify-center gap-4 mt-4 font-mono text-[10px] uppercase">
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full ring-2 ring-emerald-400"></span> Free</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full ring-2 ring-amber-400"></span> Requested</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full ring-2 ring-red-500"></span> Booked</span>
    </div>

    <div class="mt-6 p-4 rounded-xl bg-[#221c31] border border-purple-500/20 font-mono text-xs flex flex-col gap-3">
      <div class="flex justify-between">
        <span class="text-neutral-400 uppercase">Dates</span>
        <span id="selected-dates" class="text-white">Pick a start date</span>
      </div>
      <div class="flex justify-between">
        <span class="text-neutral-400 uppercase">Days</span>
        <span id="selected-days" class="text-white">–</span>
      </div>

      <label class="flex items-center justify-between cursor-pointer">
        <span class="text-white">+1 Controller</span>
        <input type="checkbox" id="extra-controller" class="w-4 h-4 accent-purple-600">
      </label>
      <label class="flex items-center justify-between cursor-pointer">
        <span class="text-white">+1 Screen</span>
        <input type="checkbox" id="extra-screen" class="w-4 h-4 accent-cyan-400">
      </label>

      <div class="flex justify-between items-center pt-3 border-t border-purple-500/20">
        <span class="text-neutral-400 uppercase">Estimated price</span>
        <span id="price" class="font-display text-2xl text-[#00eefc]">–</span>
      </div>

      <p id="selection-message"></p>
            <div id="continue-wrap" class="hidden">
        <a id="continue-btn" href="#" class="block w-full py-3 rounded-xl bg-purple-600 hover:bg-purple-500 text-white text-center font-display text-sm uppercase tracking-wider shadow-[0_0_20px_rgba(168,85,247,0.6)] transition">
          Continue →
        </a>
      </div>
    </div>

  </main>

  {{ day_status|json_script:"day-status" }}
  <script src="{% static 'rentals/calendar.js' %}"></script>
</body>
</html
